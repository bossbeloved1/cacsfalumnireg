
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CACSF Admin">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<title>Admin Sign In | CACSF Alumni</title>

<link rel="stylesheet" href="admin.css">

<style>
.login-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:25px;
  background:
    radial-gradient(circle at 10% 10%,rgba(49,91,145,.07),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(214,168,79,.08),transparent 35%),
    var(--bg)
}

.login-card{
  width:min(420px,100%);
  padding:clamp(25px,5vw,42px);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:19px;
  box-shadow:0 22px 65px rgba(23,54,93,.09)
}

.login-topline{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  margin-bottom:27px
}

.login-theme{
  width:36px;
  height:36px;
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:10px;
  cursor:pointer;
  font-size:17px
}

.login-logo{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:22px
}

.login-logo img{
  width:82px;
  height:82px;
  object-fit:contain
}

.login-heading{
  text-align:center;
  margin-bottom:28px
}

.login-heading h1{
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  font-size:25px;
  font-weight:800;
  letter-spacing:-.7px;
  color:var(--text);
  margin:0 0 8px
}

.login-heading p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  font-weight:600
}

.login-form{
  display:grid;
  gap:17px
}

.login-form .control-label{
  font-size:11px;
  color:var(--text);
  gap:8px
}

.login-form .text-input{
  width:100%;
  min-height:45px;
  padding:12px 13px;
  border-radius:9px;
  font-size:12px
}

.password-wrap{
  display:flex;
  position:relative
}

.password-wrap input{
  width:100%;
  padding-right:60px
}

.password-show{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--green2);
  font-size:10px;
  font-weight:800;
  cursor:pointer
}

.login-options{
  display:flex;
  justify-content:flex-end;
  margin-top:-5px
}

.login-options button{
  border:0;
  background:none;
  color:var(--green2);
  font-size:11px;
  font-weight:750;
  cursor:pointer;
  padding:3px 0
}

.login-submit{
  width:100%;
  min-height:46px;
  margin-top:3px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  background:#17365d;
  border-color:#17365d;
  color:#fff
}

.login-submit:hover{
  background:#244a78
}

.login-submit:disabled{
  opacity:.65;
  cursor:not-allowed
}

.login-status{
  min-height:18px;
  margin:0;
  font-size:11px;
  line-height:1.6;
  color:var(--danger)
}

.login-status.success{color:#278251}

.hidden{display:none!important}

@media(max-width:480px){
  .login-page{padding:17px}
  .login-card{padding:25px 21px}
  .login-logo img{width:72px;height:72px}
  .login-heading h1{font-size:23px}
}
</style>
</head>

<body data-admin-theme="light">

<main class="login-page">

<section class="login-card">

  <div class="login-topline">
    <button
      class="login-theme"
      id="login-theme"
      type="button"
      aria-label="Toggle light and dark mode"
    >☾</button>
  </div>

  <div class="login-logo">
    <img
      src="../images/logo.png"
      alt="CACSF Alumni Logo"
      onerror="this.style.display='none'"
    >
  </div>

  <div class="login-heading">
    <h1 id="page-heading">Welcome Back</h1>
    <p id="page-description">CACSF Admin Dashboard</p>
  </div>

  <form id="admin-login" class="login-form">

    <label class="control-label" id="email-field">
      Email Address
      <input
        class="text-input"
        type="email"
        name="email"
        id="login-email"
        placeholder="Enter your email address"
        autocomplete="username"
        required
      >
    </label>

    <label class="control-label" id="password-field">
      Password
      <span class="password-wrap">
        <input
          class="text-input"
          id="login-password"
          type="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
        <button
          class="password-show"
          type="button"
          id="show-password"
        >Show</button>
      </span>
    </label>

    <label class="control-label hidden" id="confirm-field">
      Confirm Password
      <span class="password-wrap">
        <input
          class="text-input"
          id="confirm-password"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password"
        >
      </span>
    </label>

    <div class="login-options" id="login-options">
      <button type="button" id="forgot-password">
        Forgot Password?
      </button>
    </div>

    <button
      class="button button-primary login-submit"
      type="submit"
      id="login-submit"
    >
      Sign In
    </button>

    <p
      class="login-status"
      id="login-status"
      role="status"
      aria-live="polite"
    ></p>

  </form>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);

const form = $('admin-login');
const emailInput = $('login-email');
const passwordInput = $('login-password');
const confirmInput = $('confirm-password');
const statusBox = $('login-status');
const submitButton = $('login-submit');

const params = new URLSearchParams(window.location.search);

const hashParams = new URLSearchParams(
  window.location.hash.replace(/^#/, '')
);

const authError =
  hashParams.get('error_description') ||
  params.get('error_description');

const authErrorCode =
  hashParams.get('error_code') ||
  params.get('error_code');

const invitationType = hashParams.get('type');
const queryMode = params.get('mode');

const isInvitation =
  invitationType === 'invite' || queryMode === 'invite';

const isRecovery =
  invitationType === 'recovery' || queryMode === 'recovery';

let client = null;
let currentMode = 'login';

function showStatus(message, success = false) {
  statusBox.textContent = message;
  statusBox.classList.toggle('success', success);
}

function setBusy(busy, label) {
  submitButton.disabled = busy;

  if (busy) {
    submitButton.textContent = label;
    return;
  }

  submitButton.textContent =
    currentMode === 'login'
      ? 'Sign In'
      : currentMode === 'invite'
        ? 'Create Password'
        : 'Save New Password';
}

function setPasswordMode(mode) {
  currentMode = mode;

  $('email-field').classList.toggle(
    'hidden',
    mode !== 'login'
  );

  $('confirm-field').classList.toggle(
    'hidden',
    mode === 'login'
  );

  $('login-options').classList.toggle(
    'hidden',
    mode !== 'login'
  );

  emailInput.required = mode === 'login';
  confirmInput.required = mode !== 'login';

  passwordInput.autocomplete =
    mode === 'login'
      ? 'current-password'
      : 'new-password';

  passwordInput.placeholder =
    mode === 'login'
      ? 'Enter your password'
      : 'Create a password';

  $('page-heading').textContent =
    mode === 'invite'
      ? 'Set Your Password'
      : mode === 'recovery'
        ? 'Reset Password'
        : 'Welcome Back';

  $('page-description').textContent =
    mode === 'login'
      ? 'CACSF Admin Dashboard'
      : mode === 'invite'
        ? 'Create your administrator password'
        : 'Enter your new password';

  setBusy(false);
}

function cleanAuthUrl() {
  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );
}

async function init() {

  if (
    !window.supabase ||
    !window.CACSF_SUPABASE_URL ||
    !window.CACSF_SUPABASE_ANON_KEY
  ) {
    showStatus(
      'Unable to load the login service. Please contact the administrator.'
    );

    submitButton.disabled = true;
    return;
  }

  client = window.supabase.createClient(
    window.CACSF_SUPABASE_URL,
    window.CACSF_SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  if (authError) {

    setPasswordMode('login');

    showStatus(
      authErrorCode === 'otp_expired'
        ? 'This link has expired or has already been used. Please request a new link.'
        : authError
    );

    cleanAuthUrl();
    return;
  }

  const { data, error } = await client.auth.getSession();

  if (error) {
    showStatus('Unable to verify your session. Please try again.');
    return;
  }

  const session = data?.session;

  if (isInvitation || isRecovery) {

    if (!session) {
      setPasswordMode('login');

      showStatus(
        'This link could not be verified. Please request a new link.'
      );

      return;
    }

    setPasswordMode(
      isInvitation ? 'invite' : 'recovery'
    );

    if (session.user?.email) {
      emailInput.value = session.user.email;
    }

    cleanAuthUrl();

    return;
  }

  setPasswordMode('login');
}

form.addEventListener('submit', async event => {

  event.preventDefault();

  if (!client) return;

  const password = passwordInput.value;

  if (!password) {
    showStatus('Please enter your password.');
    return;
  }

  setBusy(
    true,
    currentMode === 'login'
      ? 'Signing In...'
      : 'Saving Password...'
  );

  showStatus('');

  try {

    if (currentMode === 'login') {

      const email = emailInput.value.trim();

      const { error } =
        await client.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      window.location.replace('index.html');
      return;
    }

    if (password.length < 8) {
      throw new Error(
        'Your password must contain at least 8 characters.'
      );
    }

    if (password !== confirmInput.value) {
      throw new Error('The passwords do not match.');
    }

    const { error } = await client.auth.updateUser({
      password
    });

    if (error) throw error;

    showStatus(
      'Password saved successfully. Opening dashboard...',
      true
    );

    passwordInput.value = '';
    confirmInput.value = '';

    window.location.replace('index.html');

  } catch (error) {

    showStatus(
      error.message || 'Something went wrong. Please try again.'
    );

    setBusy(false);
  }
});

$('forgot-password').addEventListener('click', async () => {

  if (!client) return;

  const email = emailInput.value.trim();

  if (!email) {
    showStatus('Enter your email address first.');
    emailInput.focus();
    return;
  }

  const button = $('forgot-password');

  button.disabled = true;

  try {

    const { error } =
      await client.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            window.location.pathname +
            '?mode=recovery'
        }
      );

    if (error) throw error;

    showStatus(
      'If this email belongs to an account, a password reset link will be sent.',
      true
    );

  } catch (error) {

    showStatus(
      error.message || 'Unable to send the password reset email.'
    );

  } finally {

    button.disabled = false;

  }
});

$('show-password').addEventListener('click', () => {

  const visible = passwordInput.type === 'text';

  passwordInput.type = visible
    ? 'password'
    : 'text';

  $('show-password').textContent =
    visible ? 'Show' : 'Hide';
});

$('login-theme').addEventListener('click', () => {

  const body = document.body;

  const dark =
    body.dataset.adminTheme !== 'dark';

  body.dataset.adminTheme =
    dark ? 'dark' : 'light';

  $('login-theme').textContent =
    dark ? '☀' : '☾';

  localStorage.setItem(
    'cacsf-admin-theme',
    dark ? 'dark' : 'light'
  );
});

const savedTheme =
  localStorage.getItem('cacsf-admin-theme');

if (savedTheme === 'dark') {

  document.body.dataset.adminTheme = 'dark';

  $('login-theme').textContent = '☀';

}

init();

})();
</script>

<script src="./pwa.js?v=3"></script>

</body>
</html>
