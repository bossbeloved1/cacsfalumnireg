
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#123b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CACSF Admin">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Admin sign in | CACSF Alumni Fellowship</title>
<link rel="stylesheet" href="admin.css">

<style>
.login-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--bg)}
.login-art{display:none!important}
.login-side{width:100%;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);padding:clamp(24px,4vw,38px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.login-topline{display:flex;justify-content:flex-end;align-items:center;margin-bottom:25px}
.login-card h2{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:30px;line-height:1.2;font-weight:750;letter-spacing:-.035em;margin:0 0 9px;color:var(--text)}
.login-card>p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 25px}
.login-form{display:grid;gap:16px}.login-form .control-label{font-size:11px}
.password-wrap{display:flex;position:relative}.password-wrap input{width:100%;padding-right:60px}
.password-show{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--green2);font-size:11px;font-weight:750;cursor:pointer}
.login-submit{width:100%;min-height:44px;padding:13px;margin-top:4px}
.login-status{min-height:22px;font-size:11px;color:var(--danger);line-height:1.5}.login-status.success{color:var(--green2)}
.login-links{display:flex;justify-content:flex-start;gap:12px;margin-top:15px;font-size:11px;color:var(--muted)}
.login-links button,.login-links a{border:0;background:none;color:var(--green2);font-weight:750;cursor:pointer;padding:0}
.login-theme{width:35px;height:35px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;cursor:pointer}
.hidden{display:none!important}.install-app-button{width:100%;margin-top:16px;padding:12px 14px;border:1px solid #b7cc9a;border-radius:10px;background:#edf5df;color:#174d36;font-size:11px;font-weight:850;cursor:pointer}
.install-app-button:hover{background:#dfeec9}
@media(max-width:520px){.login-page{padding:14px}.login-side{padding:8px}.login-card{padding:24px 20px}}
</style>
</head>

<body data-admin-theme="light">

<main class="login-page">
<section class="login-side">
<div class="login-card">
<div class="login-topline">
<button class="login-theme" id="login-theme" type="button" aria-label="Toggle light and dark mode">☾</button>
</div>
<h2 id="page-heading">Welcome back.</h2>
<p id="page-description">Log in to your CACSF Admin Dashboard as an administrator.</p>
<form id="admin-login" class="login-form">
<label class="control-label" id="email-field">Email address
<input class="text-input" type="email" name="email" id="login-email" placeholder="Enter your email address" autocomplete="username" required>
</label>
<label class="control-label" id="password-field">Password
<span class="password-wrap"><input class="text-input" id="login-password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button class="password-show" type="button" id="show-password">Show</button></span>
</label>
<label class="control-label hidden" id="confirm-field">Confirm password
<span class="password-wrap"><input class="text-input" id="confirm-password" type="password" placeholder="Enter your password again" autocomplete="new-password"></span>
</label>
<button class="button button-primary login-submit" type="submit" id="login-submit">Log in</button>
<p class="login-status" id="login-status" role="status" aria-live="polite"></p>
</form>
<div class="login-links" id="login-links"><button type="button" id="forgot-password">Forgot password?</button></div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);

const form = $('admin-login');
const emailInput = $('login-email');
const passwordInput = $('login-password');
const confirmInput = $('confirm-password');
const statusBox = $('login-status');
const submitButton = $('login-submit');

const params = new URLSearchParams(window.location.search);
const hashParams = new URLSearchParams(
  window.location.hash.replace(/^#/, '')
);

const authError =
  hashParams.get('error_description') ||
  params.get('error_description');

const authErrorCode =
  hashParams.get('error_code') ||
  params.get('error_code');

const invitationType = hashParams.get('type');
const queryMode = params.get('mode');

const isInvitation =
  invitationType === 'invite' || queryMode === 'invite';

const isRecovery =
  invitationType === 'recovery' || queryMode === 'recovery';

let client = null;
let currentMode = 'login';

function showStatus(message, success = false) {
  statusBox.textContent = message;
  statusBox.classList.toggle('success', success);
}

function setBusy(busy, label) {
  submitButton.disabled = busy;

  if (busy) {
    submitButton.textContent = label;
    return;
  }

  submitButton.textContent =
    currentMode === 'login'
      ? 'Log in'
      : currentMode === 'invite'
        ? 'Create password'
        : 'Save password';
}

function setPasswordMode(mode) {
  currentMode = mode;

  $('email-field').classList.toggle('hidden', mode !== 'login');
  $('confirm-field').classList.toggle('hidden', mode === 'login');

  emailInput.required = mode === 'login';
  confirmInput.required = mode !== 'login';

  passwordInput.autocomplete =
    mode === 'login' ? 'current-password' : 'new-password';

  passwordInput.placeholder =
    mode === 'login' ? 'Enter your password' : 'Create a password';

  $('page-heading').textContent =
    mode === 'invite' ? 'Accept invitation.' :
    mode === 'recovery' ? 'Reset your password.' :
    'Welcome back.';

  $('page-description').textContent =
    mode === 'invite'
      ? 'Create a secure password to activate your CACSF administrator account.'
      : mode === 'recovery'
        ? 'Choose a new password for your CACSF administrator account.'
        : 'Log in to your CACSF Admin Dashboard as an administrator.';

  $('login-links').classList.toggle('hidden', mode !== 'login');

  setBusy(false);
}

function cleanAuthUrl() {
  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );
}

async function init() {

  if (
    !window.supabase ||
    !window.CACSF_SUPABASE_URL ||
    !window.CACSF_SUPABASE_ANON_KEY
  ) {
    showStatus(
      'Supabase configuration could not be loaded. Please contact the administrator.'
    );

    submitButton.disabled = true;
    return;
  }

  client = window.supabase.createClient(
    window.CACSF_SUPABASE_URL,
    window.CACSF_SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  if (authError) {
    setPasswordMode('login');

    showStatus(
      authErrorCode === 'otp_expired'
        ? 'This invitation link has expired or has already been used. Please ask the CACSF Super Admin to send a fresh invitation.'
        : authError
    );

    cleanAuthUrl();
    return;
  }

  /*
    Supabase automatically processes the invitation callback URL
    because detectSessionInUrl is enabled.

    This supports both:
    - Implicit flow: #access_token=...&type=invite
    - PKCE flow: ?code=...&mode=invite
  */

  const { data, error } = await client.auth.getSession();

  if (error) {
    showStatus(
      'Unable to verify your session. Please open your invitation link again.'
    );
    return;
  }

  const session = data?.session;

  if (isInvitation || isRecovery) {

    if (!session) {
      setPasswordMode('login');

      showStatus(
        'Your invitation or password-reset link could not be verified. Please request a fresh link.'
      );

      return;
    }

    setPasswordMode(isInvitation ? 'invite' : 'recovery');

    if (session.user?.email) {
      emailInput.value = session.user.email;
    }

    cleanAuthUrl();

    showStatus(
      isInvitation
        ? 'Invitation verified. Create and confirm your password below.'
        : 'Password reset verified. Enter your new password below.',
      true
    );

    return;
  }

  setPasswordMode('login');
}

form.addEventListener('submit', async event => {
  event.preventDefault();

  if (!client) return;

  const password = passwordInput.value;

  if (!password) {
    showStatus('Please enter your password.');
    return;
  }

  setBusy(
    true,
    currentMode === 'login'
      ? 'Signing in…'
      : 'Saving password…'
  );

  showStatus('');

  try {

    if (currentMode === 'login') {

      const email = emailInput.value.trim();

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      window.location.replace('index.html');
      return;
    }

    if (password.length < 8) {
      throw new Error(
        'Your password must contain at least 8 characters.'
      );
    }

    if (password !== confirmInput.value) {
      throw new Error('The passwords do not match.');
    }

    const { error } = await client.auth.updateUser({
      password
    });

    if (error) throw error;

    showStatus(
      'Your password has been created successfully. Opening the administrator dashboard…',
      true
    );

    passwordInput.value = '';
    confirmInput.value = '';

    window.location.replace('index.html');

  } catch (error) {

    showStatus(
      error.message || 'Something went wrong. Please try again.'
    );

    setBusy(false);
  }
});

$('forgot-password').addEventListener('click', async () => {

  if (!client) return;

  const email = emailInput.value.trim();

  if (!email) {
    showStatus('Enter your email address first.');
    emailInput.focus();
    return;
  }

  const button = $('forgot-password');
  button.disabled = true;

  try {

    const { error } =
      await client.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            window.location.pathname +
            '?mode=recovery'
        }
      );

    if (error) throw error;

    showStatus(
      'If this email belongs to an account, a password reset link will be sent.',
      true
    );

  } catch (error) {

    showStatus(
      error.message || 'Unable to send the password reset email.'
    );

  } finally {
    button.disabled = false;
  }
});

$('show-password').addEventListener('click', () => {

  const visible = passwordInput.type === 'text';

  passwordInput.type = visible ? 'password' : 'text';

  $('show-password').textContent =
    visible ? 'Show' : 'Hide';
});

$('login-theme').addEventListener('click', () => {

  const body = document.body;
  const dark = body.dataset.adminTheme !== 'dark';

  body.dataset.adminTheme = dark ? 'dark' : 'light';

  $('login-theme').textContent = dark ? '☀' : '☾';

  localStorage.setItem(
    'cacsf-admin-theme',
    dark ? 'dark' : 'light'
  );
});

const savedTheme =
  localStorage.getItem('cacsf-admin-theme');

if (savedTheme === 'dark') {
  document.body.dataset.adminTheme = 'dark';
  $('login-theme').textContent = '☀';
}

init();

})();
</script>

<script src="./pwa.js?v=3"></script>
</body>
</html>
